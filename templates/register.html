{% extends "base.html" %}
{% block title %}Register | Task Manager{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow p-6">
    <h1 class="text-2xl font-bold mb-6">Create an account</h1>
    <form method="post" class="space-y-4">
        <div>
            <label for="username" class="block text-sm font-medium mb-1">Username</label>
            <input id="username" type="text" name="username" required minlength="3" maxlength="50"
                   pattern="[A-Za-z0-9_]+" title="Letters, numbers and underscores only"
                   value="{{ form.username or '' }}"
                   class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label for="email" class="block text-sm font-medium mb-1">Email</label>
            <input id="email" type="email" name="email" required
                   value="{{ form.email or '' }}"
                   class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium mb-1">Password</label>
            <input id="password" type="password" name="password" required minlength="6"
                   class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <p class="text-xs text-gray-500 mt-1">At least 6 characters.</p>
        </div>
        <div>
            <label for="confirm_password" class="block text-sm font-medium mb-1">Confirm password</label>
            <input id="confirm_password" type="password" name="confirm_password" required minlength="6"
                   class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded">Register</button>
    </form>
    <p class="text-sm text-gray-600 mt-4">
        Already registered? <a href="{{ url_for('login') }}" class="text-blue-600 hover:underline">Log in</a>
    </p>
</div>
{% endblock %}
