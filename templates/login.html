{% extends "base.html" %}
{% block title %}Login | Task Manager{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow p-6">
    <h1 class="text-2xl font-bold mb-6">Log in</h1>
    <form method="post" class="space-y-4">
        <div>
            <label for="username" class="block text-sm font-medium mb-1">Username</label>
            <input id="username" type="text" name="username" required autofocus
                   value="{{ form.username or '' }}"
                   class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium mb-1">Password</label>
            <input id="password" type="password" name="password" required
                   class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded">Log in</button>
    </form>
    <p class="text-sm text-gray-600 mt-4">
        No account yet? <a href="{{ url_for('register') }}" class="text-blue-600 hover:underline">Register</a>
    </p>
</div>
{% endblock %}
